[package]
name = "fml-error"
description = "不背公式的全领域共享错误模型 crate（正式错误码与错误类型由 CORE-02 交付）"
version.workspace = true
edition.workspace = true
publish = false

# 正式错误模型（CORE-02）只依赖 serde：错误值要序列化成 contracts/vectors/errors-v1.json
# 规定的线上格式，反序列化时要按注册表校验。领域 crate 不依赖其他第三方 crate。
[dependencies]
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
yaml-rust2 = { workspace = true }

[lints]
workspace = true
