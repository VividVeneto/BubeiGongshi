<text x="54" y="417" font-size="15" font-weight="700" fill="#0f172a">装配、绑定与平台</text>
<text x="54" y="439" font-size="15" font-weight="700" fill="#0f172a">I/O（Dart /</text>
<text x="54" y="461" font-size="15" font-weight="700" fill="#0f172a">ArkTS）</text>
<rect x="40" y="660" width="1620" height="211" rx="12" fill="#f8fafc"/>
<text x="54" y="695" font-size="15" font-weight="700" fill="#0f172a">绑定面（Rust）</text>
<rect x="40" y="919" width="1620" height="274" rx="12" fill="#eef2f7"/>
<text x="54" y="954" font-size="15" font-weight="700" fill="#0f172a">用例、状态机与仓储</text>
<text x="54" y="976" font-size="15" font-weight="700" fill="#0f172a">（Rust）</text>
<rect x="40" y="1241" width="1620" height="190" rx="12" fill="#f8fafc"/>
<text x="54" y="1276" font-size="15" font-weight="700" fill="#0f172a">语义与密码基础</text>
<text x="54" y="1298" font-size="15" font-weight="700" fill="#0f172a">（Rust）</text>
<rect x="40" y="1479" width="1620" height="190" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="54" y="1514" font-size="15" font-weight="700" fill="#0f172a">契约、离线工具与服</text>
<text x="54" y="1536" font-size="15" font-weight="700" fill="#0f172a">务端（不在客户端依</text>
<text x="54" y="1558" font-size="15" font-weight="700" fill="#0f172a">赖链内）</text>
<text x="40" y="65" font-size="22" font-weight="700" fill="#0f172a">功能—模块总览</text>
<text x="40" y="95" font-size="14" fill="#475569">计划模块，仓库当前不含应用源码。实线箭头：编译期依赖，只允许自上而下；同层箭头：装配关系；虚线框：不在客户端依赖链内；框内“需求”为承载的需求编号。</text>
<text x="40" y="1704" font-size="13" fill="#475569">依赖规则、端口与需求追踪见 14 功能与代码模块映射；本图由 tools/generate-feature-map.py 从映射数据生成。</text>
