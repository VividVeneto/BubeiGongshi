<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1749" viewBox="0 0 1700 1749" role="img" aria-labelledby="fm-title fm-desc" font-family="'Microsoft YaHei','微软雅黑','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','PingFang SC','Hiragino Sans GB',sans-serif">
<title id="fm-title">功能—模块总览</title>
<desc id="fm-desc">计划模块自上而下分层，界面：presentation、ohos-arkts；装配与平台：platform_io、composition、binding、ohos-napi；绑定面：fml-ffi；用例与仓储：fml-study、fml-recognition、fml-assets、fml-store、fml-sync；基础：fml-core、fml-crypto；链外：contracts、tools-content、server。编译期依赖：presentation → composition、ohos-arkts → ohos-napi、composition → platform_io、composition → binding、binding → fml-ffi、ohos-napi → fml-ffi、fml-ffi → fml-study、fml-ffi → fml-recognition、fml-ffi → fml-assets、fml-ffi → fml-store、fml-ffi → fml-sync、fml-study → fml-core、fml-recognition → fml-core、fml-assets → fml-core、fml-store → fml-core、fml-store → fml-crypto、fml-sync → fml-crypto。</desc>
<defs>
<marker id="fm-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
</defs>
