  fml-sync: [fml-ast, fml-crypto, fml-sync-proto, fml-error]
  fml-ffi: [fml-ast, fml-latex, fml-notation, fml-units, fml-type, fml-eval, fml-derive, fml-typeset, fml-export, fml-srs, fml-grade, fml-study, fml-crypto, fml-sync-proto, fml-imgproc, fml-recognize-local, fml-recognize, fml-pack, fml-store, fml-sync, fml-error]
